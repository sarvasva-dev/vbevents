<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5892b" />
      <stop offset="50%" stop-color="#e2c582" />
      <stop offset="100%" stop-color="#9a711d" />
    </linearGradient>
  </defs>

  <!-- Typographic Monogram Circle -->
  <g transform="translate(5, 5)">
    <!-- Thin luxury gold outer circle -->
    <circle cx="20" cy="20" r="19" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Typographic V and B inside circle using Georgia/Playfair serif typography -->
    <text x="8" y="26" 
          font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
          font-size="18" 
          font-weight="600" 
          font-style="italic" 
          fill="url(#goldGrad)">V</text>
    <text x="21" y="26" 
          font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
          font-size="18" 
          font-weight="600" 
          font-style="italic" 
          fill="url(#goldGrad)">B</text>
  </g>

  <!-- Typography Column -->
  <g transform="translate(58, 0)">
    <!-- VISION BEYOND (Luxury Serif Style) -->
    <text x="0" y="23" 
          font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
          font-size="18" 
          font-weight="700" 
          fill="#0f172a" 
          letter-spacing="1.5">VISION BEYOND</text>
          
    <!-- EVENTS (Minimalist Spaced Sans-Serif Style) -->
    <text x="1" y="38" 
          font-family="'Montserrat', 'Inter', 'Helvetica', sans-serif" 
          font-size="9" 
          font-weight="600" 
          fill="#b5892b" 
          letter-spacing="8">E V E N T S</text>
  </g>
</svg>
